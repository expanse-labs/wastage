# No Linear issue per Dependabot pull request here: this is an internal tool, so a bump is reviewed on the PR
# alone (INF-187 decision, 18 September 2026); platform, access, models and staff run dependabot-linear-issue.

# Dependabot version updates. Alerts and security updates come from the code-security
# configuration attached to the repository, not from this file (INF-175).

# The github-actions ecosystem reads .github/workflows only; the action pins under
# .depot/workflows are bumped by hand.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    # Release-ageing window as in the monorepo: never bump to a version published fewer
    # than seven days ago. Security updates bypass the cooldown.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      web-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-base-images:
        patterns:
          - "*"
