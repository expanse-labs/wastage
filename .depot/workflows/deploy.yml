name: Deploy Wastage
# Auto-triggers on push to main when source or Dockerfile change

on:
  push:
    branches: [main]
    paths:
      - src/**
      - static/**
      - Dockerfile
      - package.json
      - bun.lock
      - .depot/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  DEPOT_REGISTRY: registry.depot.dev/${{ vars.DEPOT_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy Wastage
    runs-on: depot-ubuntu-24.04-4
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    concurrency:
      group: deploy-wastage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: depot/setup-action@v1
      - name: Build and save image
        env:
          TAG: ${{ github.sha }}
        run: |
          SHORT_TAG="${TAG::7}"
          IMAGE="${DEPOT_REGISTRY}:wastage-${SHORT_TAG}"
          depot build --project ${{ vars.DEPOT_PROJECT_ID }} \
            --platform linux/arm64 \
            --save \
            --save-tag "wastage-${SHORT_TAG}" \
            --save-tag wastage-latest \
            .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
      - name: Update K8s manifest
        run: |
          git config user.name "depot-ci"
          git config user.email "ci@expanse.sh"
          git pull origin main --rebase
          sed -i "s|image: registry.depot.dev/.*:wastage.*|image: ${IMAGE}|" \
            deploy/k8s/deployment.yaml
          git add deploy/k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore(deploy): update wastage image [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull origin main --rebase
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "failed to push manifest update after 5 attempts" >&2
          exit 1
